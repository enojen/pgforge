; Reference config retained for documentation. The container image
; (edoburu/pgbouncer) builds its own ini from environment variables in
; docker-compose.yml — this file is not mounted today, but is kept here
; so future experiments (Experiment 2) can switch to a hand-managed config.

[databases]
pgforge = host=postgres port=5432 dbname=pgforge

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 600
log_connections = 1
log_disconnections = 1
