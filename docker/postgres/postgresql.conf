# pgforge custom postgresql.conf
# Tuned for laptop-scale experimentation, not production.
# Defaults that affect benchmarks are made explicit so results stay reproducible.

listen_addresses = '*'
max_connections = 200

# Memory (tiny, laptop)
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB

# WAL — explicit so experiments aren't surprised by PG18 default drift
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_timeout = 5min

# Logging — visibility into slow queries during experiments
log_min_duration_statement = 200
log_lock_waits = on
log_line_prefix = '%t [%p]: db=%d,user=%u '
log_statement = 'none'

# Autovacuum — explicit so Experiment 7-style ORM disasters are reproducible
autovacuum = on
autovacuum_naptime = 1min

# Statement timeout default — experiments override per session, this is a safety net
statement_timeout = 0
lock_timeout = 0

# Stats for pg_stat_statements (ext loaded later if an experiment needs it)
track_io_timing = on
track_activities = on
